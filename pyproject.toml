[project]
name = "concrete-tclb"
version = "0.1.0"
description = "ConCReTE scenario: finding abandoned single-family homes for the TriCOG Land Bank"
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.0",
    "marimo==0.18.0",
    "pandas>=2.2.3",
    "pyarrow>=17",
    "shapely>=2.0",
]

[tool.marimo.runtime]
output_max_bytes = 100_000_000
